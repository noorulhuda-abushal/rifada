<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رِفادة | تأكيد الحجز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <div class="container" style="max-width: 1000px">
    <div class="steps-path">
      <span data-i18n="step1"></span><span class="sep">←</span>
      <span data-i18n="step2"></span><span class="sep">←</span>
      <span class="current" data-i18n="step3"></span>
    </div>

    <div style="padding-top: 14px">
      <a href="#" id="back-link" data-i18n="back_hotel"></a>
    </div>

    <h1 class="display" style="font-size: 38px; padding-top: 12px" data-i18n="booking_title"></h1>

    <!-- رسالة النجاح (مخفية حتى يتم الحجز) -->
    <section class="card success hidden" id="success-box" style="margin-block: 20px 56px">
      <div class="ok" id="ok-icon"></div>
      <h2 data-i18n="success_title"></h2>
      <span class="muted" data-i18n="success_ref"></span>
      <span class="ref" id="ref-number"></span>
      <p class="muted" style="margin: 0; max-width: 480px" data-i18n="success_note"></p>
      <a href="index.html" class="btn" data-i18n="back_home"></a>
    </section>

    <div class="layout" id="booking-layout">
      <form class="main card" id="booking-form" novalidate>
        <h2 data-i18n="group_info"></h2>
        <div class="field">
          <label for="g-name" data-i18n="g_name"></label>
          <input id="g-name" type="text" data-i18n-placeholder="g_name_ph">
        </div>
        <div class="field">
          <label for="g-license" data-i18n="g_license"></label>
          <input id="g-license" type="text">
        </div>
        <div class="field">
          <label for="g-phone" data-i18n="g_phone"></label>
          <input id="g-phone" type="tel" placeholder="05xxxxxxxx" inputmode="numeric" dir="ltr">
        </div>
        <div class="field">
          <label for="g-email" data-i18n="g_email"></label>
          <input id="g-email" type="email" dir="ltr">
        </div>
        <label class="check"><input type="checkbox" id="g-agree"> <span data-i18n="agree"></span></label>
        <p class="form-error hidden" id="booking-error" role="alert"></p>
        <button type="submit" class="btn btn-block" data-i18n="confirm_btn"></button>
      </form>

      <aside class="side" style="display: flex; flex-direction: column; gap: 16px">
        <div class="card card-gold" id="summary"></div>
        <div class="notice" data-i18n="after_note"></div>
      </aside>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
